    <script>
      // aplicar el tema guardado antes del primer paint (sin flash)
      try {
        if (localStorage.getItem('vr.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.background = '#343439';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#343439');
        }
      } catch (e) { /* modo privado */ }
    </script>
